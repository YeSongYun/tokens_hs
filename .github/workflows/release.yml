name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      # 生成 Changelog
      - name: Generate Changelog
        id: changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          GITHUB_REPO: ${{ github.repository }}

      - name: Build Windows AMD64
        env:
          CGO_ENABLED: 1
        run: |
          $VERSION = "${{ github.ref_name }}"
          go build -ldflags="-s -w -H windowsgui" -o "tokens_hs-${VERSION}-windows-amd64.exe"
        shell: pwsh

      # 创建 Release
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Tokens 价格计算器 ${{ github.ref_name }}
          body: |
            ## Tokens 价格计算器 ${{ github.ref_name }}

            一个快速换算 Token 单价与消费/用量的桌面小工具。

            ---

            ${{ steps.changelog.outputs.content }}

            ---

            ### 📥 下载

            | 平台 | 架构 | 文件 |
            |------|------|------|
            | Windows | x64 | `tokens_hs-${{ github.ref_name }}-windows-amd64.exe` |

            ---

            ### 🛠️ 使用说明

            ```powershell
            # 下载后直接双击运行即可
            .\tokens_hs-${{ github.ref_name }}-windows-amd64.exe
            ```

            ---

            ### 🔗 相关链接

            - [项目主页](https://github.com/${{ github.repository }})
            - [CNB 仓库](https://cnb.cool/dmxapi/tokens_hs)
          files: |
            tokens_hs-${{ github.ref_name }}-windows-amd64.exe
