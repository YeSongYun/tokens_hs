# ============================================
# CNB 云原生构建配置 - Tokens 价格计算器
# ============================================

# 主分支推送 - 同步到 GitHub
main:
  push:
    - imports: https://cnb.cool/dmxapi/claude-code-my/-/blob/main/env.yml
      stages:
        - name: sync to github with rebase
          image: tencentcom/git-sync
          settings:
            target_url: https://github.com/YeSongYun/tokens_hs.git
            auth_type: https
            username: ${GIT_USERNAME} 
            password: ${GIT_ACCESS_TOKEN}
            sync_mode: force

# Tag 推送 - 自动发布 Release
$:
  tag_push:
    - imports: https://cnb.cool/dmxapi/claude-code-my/-/blob/main/env.yml
      stages:
        # 0. 先同步 Tag 到 GitHub
        - name: sync tag to github
          image: alpine/git
          script:
            - git remote add github https://${GIT_USERNAME}:${GIT_ACCESS_TOKEN}@github.com/YeSongYun/tokens_hs.git || true
            - git push github ${CNB_BRANCH} --force

        # 1. 生成更新日志（使用 git-cliff 支持 commit 自动分类）
        - name: 生成更新日志
          image: cnbcool/default-build-env
          script:
            - curl -sSL https://github.com/orhun/git-cliff/releases/download/v2.7.0/git-cliff-2.7.0-x86_64-unknown-linux-gnu.tar.gz | tar xz
            - git fetch --tags origin
            - ./git-cliff-2.7.0/git-cliff --config cliff.toml --latest --strip header
          exports:
            stdout: RELEASE_NOTES

        # 2. 编译 Windows AMD64（使用 fyne-cross 支持 CGO 交叉编译）
        - name: 编译 Windows AMD64
          image: fyneio/fyne-cross-images:windows
          script:
            - fyne-cross windows -arch=amd64 -app-id=cn.dmxapi.tokens_hs -ldflags="-s -w"
            - mv fyne-cross/bin/windows-amd64/tokens_hs.exe ./tokens_hs-${CNB_BRANCH}-windows-amd64.exe

        # 3. 创建 Release
        - name: 创建 Release
          type: git:release
          options:
            title: Tokens 价格计算器 ${CNB_BRANCH}
            description: |
              ## Tokens 价格计算器 ${CNB_BRANCH}

              一个快速换算 Token 单价与消费/用量的桌面小工具。

              ---

              ${RELEASE_NOTES}

              ---

              ### 📥 下载

              | 平台 | 架构 | 文件 |
              |------|------|------|
              | Windows | x64 | `tokens_hs-${CNB_BRANCH}-windows-amd64.exe` |

              ---

              ### 🛠️ 使用说明

              ```powershell
              # 下载后直接双击运行即可
              .\tokens_hs-${CNB_BRANCH}-windows-amd64.exe
              ```

              ---

              ### 🔗 相关链接

              - [项目主页](https://cnb.cool/dmxapi/tokens_hs)
              - [GitHub 镜像](https://github.com/YeSongYun/tokens_hs)

        # 4. 上传 Release 附件
        - name: 上传 Release 附件
          image: cnbcool/attachments
          settings:
            attachments:
              - "./tokens_hs-${CNB_BRANCH}-*"
            ttl: 0

        # 5. 清理旧版本，只保留最近3个
        - name: 清理旧版本
          image: docker.cnb.cool/cnb/plugins/cnbcool/release-clean:latest
          settings:
            filter: "RECENT_N=3"
            debug: false
